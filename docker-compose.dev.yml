services:
  postgres:
    image: ghcr.io/yv1ing/postgres-for-rag:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: safeagent
    ports:
      - 5432:5432
    # volumes:
    #   - ./.postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d safeagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: ghcr.io/yv1ing/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@safeagent.dev
      PGADMIN_DEFAULT_PASSWORD: 123456
      PGADMIN_LISTEN_PORT: 5433
    ports:
      - 5433:5433
    # volumes:
    #   - ./.pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
